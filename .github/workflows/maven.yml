name: Java CI with Maven

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        java-version: [17, 21]
      fail-fast: false
    
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up JDK ${{ matrix.java-version }}
      uses: actions/setup-java@v3
      with:
        java-version: ${{ matrix.java-version }}
        distribution: 'temurin'
        cache: maven
    
    - name: Build with Maven
      run: mvn -B package --file pom.xml
    
    - name: Test with Maven
      run: mvn -B test --file pom.xml
      
    - name: Upload regular JAR
      uses: actions/upload-artifact@v3
      if: success() && matrix.java-version == '17' && matrix.os == 'ubuntu-latest'
      with:
        name: webapkconverter-jar
        path: target/WebToApkConverter-*.jar
        if-no-files-found: warn
        
    - name: Upload JAR with dependencies
      uses: actions/upload-artifact@v3
      if: success() && matrix.java-version == '17' && matrix.os == 'ubuntu-latest'
      with:
        name: webapkconverter-jar-with-dependencies
        path: target/WebToApkConverter-*-jar-with-dependencies.jar
        if-no-files-found: warn

  # Optional job for releasing - can be manually triggered later
  release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    
    - name: Build with Maven
      run: mvn -B package --file pom.xml
    
    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Release ${{ github.ref }}
        draft: false
        prerelease: false
    
    - name: Upload Release Asset JAR with dependencies
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./target/WebToApkConverter-*-jar-with-dependencies.jar
        asset_name: WebToApkConverter-${{ github.ref_name }}-jar-with-dependencies.jar
        asset_content_type: application/java-archive

