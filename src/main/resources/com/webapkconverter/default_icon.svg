<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1"/>
      <feOffset dx="1" dy="1" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.2"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="iconGradient" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#7f8c8d" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#95a5a6" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="highlightGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  
  <!-- Android Adaptive Icon Shape (Squircle) -->
  <rect x="24" y="24" width="208" height="208" rx="50" ry="50" fill="url(#iconGradient)" filter="url(#shadow)"/>
  
  <!-- Top Highlight -->
  <rect x="24" y="24" width="208" height="10" rx="5" ry="5" fill="url(#highlightGradient)" opacity="0.3"/>
  
  <!-- Minimal Android Symbol -->
  <g transform="translate(128, 128) scale(0.7)">
    <!-- Android Head -->
    <circle cx="0" cy="-20" r="30" fill="#7f8c8d"/>
    
    <!-- Android Eyes -->
    <circle cx="-12" cy="-30" r="5" fill="#95a5a6"/>
    <circle cx="12" cy="-30" r="5" fill="#95a5a6"/>
    
    <!-- Android Body -->
    <rect x="-30" y="10" width="60" height="60" rx="5" ry="5" fill="#7f8c8d"/>
    
    <!-- Android Arms -->
    <rect x="-50" y="15" width="20" height="10" rx="5" ry="5" fill="#7f8c8d"/>
    <rect x="30" y="15" width="20" height="10" rx="5" ry="5" fill="#7f8c8d"/>
    
    <!-- Android Legs -->
    <rect x="-25" y="70" width="10" height="30" rx="5" ry="5" fill="#7f8c8d"/>
    <rect x="15" y="70" width="10" height="30" rx="5" ry="5" fill="#7f8c8d"/>
  </g>
</svg>

