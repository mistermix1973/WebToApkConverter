<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="2" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="arrowGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#eeeeee" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  
  <!-- Browser Window -->
  <rect x="24" y="40" width="140" height="176" rx="2" ry="2" fill="#3498db" filter="url(#shadow)"/>
  
  <!-- Browser Address Bar -->
  <rect x="24" y="40" width="140" height="20" rx="2" ry="2" fill="#ffffff"/>
  
  <!-- Browser Navigation Buttons -->
  <circle cx="35" cy="50" r="4" fill="#e74c3c"/>
  <circle cx="50" cy="50" r="4" fill="#f1c40f"/>
  <circle cx="65" cy="50" r="4" fill="#2ecc71"/>
  
  <!-- Phone Shape -->
  <rect x="120" y="64" width="112" height="168" rx="8" ry="8" fill="#2ecc71" filter="url(#shadow)"/>
  
  <!-- Phone Screen -->
  <rect x="128" y="80" width="96" height="120" rx="4" ry="4" fill="#27ae60"/>
  
  <!-- Phone Home Button -->
  <circle cx="176" cy="216" r="10" fill="#27ae60" stroke="#ffffff" stroke-width="2"/>
  
  <!-- Transformation Arrow -->
  <path d="M90 120 C 120 100, 140 160, 160 140" stroke="url(#arrowGradient)" stroke-width="6" fill="none" stroke-linecap="round" filter="url(#shadow)"/>
  <polygon points="160,140 150,130 170,135" fill="#ffffff"/>
</svg>

